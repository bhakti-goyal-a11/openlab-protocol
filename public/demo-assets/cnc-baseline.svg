<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <radialGradient id="laserGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)" />
  
  <!-- Grid overlay -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800" />
    <path d="M100 0 V500 M200 0 V500 M300 0 V500 M400 0 V500 M500 0 V500 M600 0 V500 M700 0 V500" />
  </g>

  <!-- CNC Head Mount -->
  <rect x="300" y="40" width="200" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <rect x="350" y="60" width="100" height="20" rx="4" fill="#0f172a" />
  <circle cx="370" cy="70" r="4" fill="#10b981" />
  <text x="385" y="74" fill="#10b981" font-family="monospace" font-size="10">SPINDLE READY</text>

  <!-- Spindle Body -->
  <path d="M340 160 L460 160 L430 300 L370 300 Z" fill="url(#metalGrad)" stroke="#64748b" stroke-width="2" />
  <line x1="340" y1="210" x2="460" y2="210" stroke="#1e293b" stroke-width="3" />
  <line x1="355" y1="250" x2="445" y2="250" stroke="#1e293b" stroke-width="3" />

  <!-- ER20 Collet Chuck (Clean, pristine condition) -->
  <rect x="380" y="300" width="40" height="35" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="2" />
  <!-- Carbide Endmill Bit -->
  <rect x="395" y="335" width="10" height="60" fill="#e2e8f0" stroke="#94a3b8" />
  <!-- Flutes -->
  <path d="M395 345 L405 355 M395 365 L405 375 M395 385 L405 395" stroke="#475569" stroke-width="1.5" />

  <!-- Laser Alignment Crosshair (Green - Pristine Calibration) -->
  <circle cx="400" cy="395" r="40" fill="url(#laserGlow)" />
  <line x1="330" y1="395" x2="470" y2="395" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="400" y1="325" x2="400" y2="465" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4" />
  <circle cx="400" cy="395" r="8" fill="none" stroke="#10b981" stroke-width="2" />

  <!-- Workpiece bed -->
  <rect x="150" y="430" width="500" height="40" rx="4" fill="#1e293b" stroke="#334155" />
  <!-- Precision Clamps -->
  <rect x="180" y="415" width="40" height="15" fill="#f59e0b" rx="2" />
  <rect x="580" y="415" width="40" height="15" fill="#f59e0b" rx="2" />

  <!-- Telemetry HUD Overlay -->
  <g font-family="monospace" font-size="11" fill="#94a3b8">
    <rect x="20" y="20" width="220" height="90" rx="6" fill="#020617" stroke="#1e293b" fill-opacity="0.8" />
    <text x="35" y="42" fill="#10b981" font-weight="bold">● BASELINE VERIFIED</text>
    <text x="35" y="62">RPM: 0 [IDLE]</text>
    <text x="35" y="78">RUNOUT: &lt; 0.002 mm</text>
    <text x="35" y="94">COLLET: ER20 [CLEAN]</text>
  </g>
</svg>

