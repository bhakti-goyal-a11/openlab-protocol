<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#180e0e" />
    </linearGradient>
    <linearGradient id="metalGradD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <radialGradient id="damageGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGradD)" />
  
  <!-- Grid overlay -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800" />
    <path d="M100 0 V500 M200 0 V500 M300 0 V500 M400 0 V500 M500 0 V500 M600 0 V500 M700 0 V500" />
  </g>

  <!-- CNC Head Mount -->
  <rect x="300" y="40" width="200" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <rect x="350" y="60" width="100" height="20" rx="4" fill="#0f172a" />
  <circle cx="370" cy="70" r="4" fill="#ef4444" />
  <text x="385" y="74" fill="#ef4444" font-family="monospace" font-size="10">ANOMALY DETECTED</text>

  <!-- Spindle Body -->
  <path d="M340 160 L460 160 L430 300 L370 300 Z" fill="url(#metalGradD)" stroke="#64748b" stroke-width="2" />
  <line x1="340" y1="210" x2="460" y2="210" stroke="#1e293b" stroke-width="3" />
  <line x1="355" y1="250" x2="445" y2="250" stroke="#1e293b" stroke-width="3" />

  <!-- ER20 Collet Chuck (DAMAGED FRACTURE) -->
  <rect x="380" y="300" width="40" height="35" rx="3" fill="#1c1917" stroke="#ef4444" stroke-width="3" />
  
  <!-- Severe Collet Crack Path -->
  <path d="M390 300 L395 315 L392 325 L402 335" stroke="#ef4444" stroke-width="3" fill="none" />
  <path d="M410 305 L406 318 L415 330" stroke="#f97316" stroke-width="2" fill="none" />

  <!-- Broken / Chipped Carbide Endmill Bit -->
  <path d="M395 335 L405 335 L403 365 L397 360 Z" fill="#94a3b8" stroke="#ef4444" stroke-width="1.5" />

  <!-- Damage Heatmap Target Circle -->
  <circle cx="396" cy="320" r="45" fill="url(#damageGlow)" />
  <circle cx="396" cy="320" r="28" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3" />
  
  <!-- Displaced Metal Shards -->
  <polygon points="418,340 424,344 420,348" fill="#f59e0b" />
  <polygon points="375,350 372,356 379,354" fill="#f59e0b" />

  <!-- Workpiece bed with gouge mark -->
  <rect x="150" y="430" width="500" height="40" rx="4" fill="#1e293b" stroke="#334155" />
  <path d="M380 435 Q400 442 420 437" stroke="#ef4444" stroke-width="3" fill="none" />

  <!-- Precision Clamps -->
  <rect x="180" y="415" width="40" height="15" fill="#f59e0b" rx="2" />
  <rect x="580" y="415" width="40" height="15" fill="#f59e0b" rx="2" />

  <!-- Telemetry HUD Overlay (Warning) -->
  <g font-family="monospace" font-size="11" fill="#94a3b8">
    <rect x="20" y="20" width="240" height="95" rx="6" fill="#020617" stroke="#ef4444" stroke-width="1.5" fill-opacity="0.85" />
    <text x="35" y="42" fill="#ef4444" font-weight="bold">⚠️ DAMAGE REPORTED (COLLET)</text>
    <text x="35" y="62">VARIANCE: +3.41 mm RUNOUT</text>
    <text x="35" y="78">FRACTURE: ER20 SLOT ABNORMAL</text>
    <text x="35" y="94" fill="#f59e0b">EST. PENALTY: -15.0 TRUST</text>
  </g>
</svg>

